services:

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8080:8080"
    networks:
      - microservices-network

  inventry-service:
    build: ./inventry-service
    container_name: inventry-service
    ports:
      - "8081:8081"
    networks:
      - microservices-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge